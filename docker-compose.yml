services:
  feedbot:
    image: "${FEEDBOT_IMAGE:-ghcr.io/chlorinefactory/congmiao-feedbot:v2.1.0}"
    restart: unless-stopped
    env_file: .env
    environment:
      FEEDBOT__TELEGRAM__TOKEN: "${FEEDBOT__TELEGRAM__TOKEN:?Set FEEDBOT__TELEGRAM__TOKEN in .env}"
      FEEDBOT__NETEASE__API_BASE: "${FEEDBOT__NETEASE__API_BASE:-http://netease-api:3000}"
    volumes:
      - feedbot-v2-data:/data
      # Optional custom settings for the published image.
      # - ./config/default.toml:/app/config/default.toml:ro
    # Enable for webhook mode with a reverse proxy on the host.
    # ports:
    #   - "127.0.0.1:8080:8080"

  netease-api:
    image: "${NETEASE_API_IMAGE:-moefurina/ncm-api:latest}"
    profiles: [netease]
    restart: unless-stopped
    environment:
      PORT: "3000"
      ENABLE_GENERAL_UNBLOCK: "${NETEASE_ENABLE_GENERAL_UNBLOCK:-true}"
      ENABLE_FLAC: "${NETEASE_ENABLE_FLAC:-true}"

  telegram-bot-api:
    image: "${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}"
    profiles: [telegram-local]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  feedbot-v2-data:
  telegram-bot-api-data:
